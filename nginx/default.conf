# Lifecycle Stage: Edge Reverse Proxy -> API Routing, Static Assets & SPA Fallback
# Production Invariant (🔴): Forwards X-Forwarded-Proto for Django TLS awareness and falls back deep routes to /index.html.
# Trap Prevented (⚠️): Refreshing /tickets or /audit returning 404, or Django redirect loops behind TLS termination.

upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for JSON payloads and JS/CSS bundles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/csv image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse proxy Django API, Admin & WhiteNoise static assets
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Immutable cache for content-hashed Vite bundles
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so client-side routes (/tickets, /projects, /audit) never 404 on hard refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
