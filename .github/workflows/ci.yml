name: CI — Django + React Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Migrations + PostgreSQL 17 Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opsdesk_test
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opsdesk -d opsdesk_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-ephemeral-secret-key-for-automated-testing-only-987654321"
      DATABASE_URL: "postgres://opsdesk:opsdesk_ci_password@127.0.0.1:5432/opsdesk_test"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks & test suite
        run: |
          python manage.py check
          python manage.py test -v 2

  frontend:
    name: Frontend (TypeScript Strict + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Production Vite build
        run: npm run build
